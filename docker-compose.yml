version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskholt_postgres
    restart: always
    environment:
      POSTGRES_USER: deskholt_user
      POSTGRES_PASSWORD: deskholt_password
      POSTGRES_DB: deskholt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskholt_user -d deskholt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deskholt_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
